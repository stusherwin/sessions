<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session manager</title>
</head>

<body>
  <div class="container py-4 px-3 mx-auto mb-4">
    <h1>Session manager</h1>

    <div id="waveform" class="my-4"></div>

    <div x-data x-id="['loop']">
      <div>
        <button @click="$store.player.skipToStart()" class="btn btn-sm btn-dark">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use href="#skip-start-fill" />
          </svg>
        </button>
        <button @click="$store.player.playPause()" class="btn btn-sm btn-dark">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use x-show="!$store.player.playing" href="#play-fill" />
            <use x-show="$store.player.playing" href="#pause-fill" />
          </svg>
        </button>
        <button @click="$store.player.skipToEnd()" class="btn btn-sm btn-dark">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use href="#skip-end-fill" />
          </svg>
        </button>
      </div>

      <template x-for="song in $store.songs.all" :key="song.id">
        <div x-data="song">
          <div class="song card mt-4 shadow-sm" :class="current && 'border-2 border-primary'">
            <div class="card-header" :class="current && 'bg-primary-subtle border-primary'">
              <div x-text="id"></div>

              <!-- <h5 x-text="name"></h5> -->
              <input type="text" x-model="name" class="w-100" />
            </div>
            <div class="card-body pb-0">
            <div class="mb-3">
              <button @click="skipToStart()" class="btn btn-sm btn-dark">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use href="#skip-start-fill" />
                </svg>
              </button>
              <button @click="$store.player.playPause()" class="btn btn-sm btn-dark">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use x-show="!$store.player.playing" href="#play-fill" />
                  <use x-show="$store.player.playing" href="#pause-fill" />
                </svg>
              </button>
              <button @click="skipToEnd()" class="btn btn-sm btn-purple">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use href="#skip-end-fill" />
                </svg>
              </button>
              <button @click="loop = !loop" class="btn btn-sm btn-outline-dark" :class="loop && 'bg-dark text-light'">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use href="#repeat" />
                </svg>
              </button>
              <button @click="$dispatch('sx-split', id)" class="btn btn-sm btn-dark" :disabled="!current">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use href="#layout-split" />
                </svg>
              </button>
              <button @click="remove()" class="btn btn-sm btn-dark">
                <svg class="bi" width="16" height="16" fill="currentColor">
                  <use href="#trash-fill" />
                </svg>                
              </button>
            </div>
            <!-- <button @click="$dispatch('shunt-region-left', region.id)">&lt; Shunt</button>
                    <button @click="$dispatch('shunt-region-right', region.id)">Shunt &gt;</button>
                    <button @click="$dispatch('nudge-region-left', region.id)">&lt; Nudge</button>
                    <button @click="$dispatch('nudge-region-right', region.id)">Nudge &gt;</button>
                    <button @click="$dispatch('copy-region', region.id)">Copy</button>
                    <button @click="delete()">Delete</button>-->
            <template x-for="section in sections" :key="section.id">
              <div x-data="section">
                <div class="section mx-n3 border-top p-3" :class="current && 'bg-primary-subtle'">
                  <div x-text="id"></div>
                  <input type="text" x-model="name" class="w-100" />
                  <div class="mt-3">
                    <button @click="skipToStart()" class="btn btn-sm btn-dark">
                      <svg class="bi" width="16" height="16" fill="currentColor">
                        <use href="#skip-start-fill" />
                      </svg>
                    </button>
                    <button @click="$store.player.playPause()" class="btn btn-sm btn-dark">
                      <svg class="bi" width="16" height="16" fill="currentColor">
                        <use x-show="!$store.player.playing" href="#play-fill" />
                        <use x-show="$store.player.playing" href="#pause-fill" />
                      </svg>
                    </button>
                    <button @click="skipToEnd()" class="btn btn-sm btn-dark">
                      <svg class="bi" width="16" height="16" fill="currentColor">
                        <use href="#skip-end-fill" />
                      </svg>
                    </button>
                    <button @click="loop = !loop" class="btn btn-sm btn-outline-dark" :class="loop && 'btn-dark'">
                      <svg class="bi" width="16" height="16" fill="currentColor">
                        <use href="#repeat" /> Loop
                      </svg>
                    </button>
                  </div>
                  <!-- <button @click="$dispatch('sx-split', id)">Split</button> -->
                  <!-- <button @click="remove()">Delete</button> -->
                  <!-- <button @click="$dispatch('shunt-region-left', region.id)">&lt; Shunt</button>
                            <button @click="$dispatch('shunt-region-right', region.id)">Shunt &gt;</button>
                            <button @click="$dispatch('nudge-region-left', region.id)">&lt; Nudge</button>
                            <button @click="$dispatch('nudge-region-right', region.id)">Nudge &gt;</button>
                            <button @click="$dispatch('copy-region', region.id)">Copy</button>
                            <button @click="delete()">Delete</button>-->
                </div>
              </div>
            </template>
          </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script type="module" src="./ts/main.ts"></script>
  <div id="all" hidden ></div>
</body>

</html>
