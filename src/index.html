<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session manager</title>
</head>

<body>
  <div>
    <h1>Session manager</h1>

    <div x-data>
      <template x-for="(session, index) in $store.sessions.all">
        <div>
          <div :data-session-id="session.id" class="waveform my-4"></div>
          <div>
            <button @click="session.skipToStart()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-start-fill" />
              </svg>
            </button>
            <button @click="session.skipBackward()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-backward-fill" />
              </svg>
            </button>
            <button @click="session.playPause()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use x-show="!session.playing" href="#play-fill" />
                <use x-show="session.playing" href="#pause-fill" />
              </svg>
            </button>
            <button @click="session.skipForward()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-forward-fill" />
              </svg>
            </button>
            <button @click="session.skipToEnd()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-end-fill" />
              </svg>
            </button>
            <button @click="session.zoomIn()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#zoom-in" />
              </svg>
            </button>
            <button @click="session.zoomOut()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#zoom-out" />
              </svg>
            </button>
            <button @click="session.toggleEditing()" :class="session.editing ? 'inverted' : ''">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#pencil-fill" />
              </svg>
            </button>
          </div>

          <template x-for="song in session.songs">
            <div x-data x-init="$watch('song.name', name => session.updateSongName(song.id, name))">
              <div x-show="song.current">
                <div x-text="song.id"></div>
                <input type="text" x-model="song.name" />
                <div x-text="song.name"></div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

  <script type="module" src="./ts/main.ts"></script>
  <div id="all" hidden ></div>
</body>

</html>
