<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <div x-data="app">
    <a href="#" @click="loadSessions()">Sessions</a> |
    <a href="#" @click="loadTunes()">Tunes</a>
    <template x-if="pageState.page == 'sessions'">
      <div>
        <h1>Sessions</h1>

        <ul>
        <template x-for="session in sessions">
          <li>
            <a href="#" x-text="session.name" @click="loadSession(session.id, session.name)"></a>
            <ul>
            <template x-for="tune in session.tunes">
              <li><a href="#" x-text="tune.tuneName" @click="loadSession(session.id, session.name)"></a></li>
            </template>
            </ul>
          </li>
        </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'tunes'">
      <div>
        <h1>Tunes</h1>

        <ul>
        <template x-for="tune in tunes">
          <li>
            <a href="#" x-text="tune.name" @click="loadTune(tune)"></a>
            <ul>
            <template x-for="performance in tune.performances">
              <li><a href="#" x-text="performance.sessionName" @click="loadSession(performance.sessionId, performance.sessionName)"></a></li>
            </template>
            </ul>
          </li>
        </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'tune'">
      <div>
        <h1 x-text="pageState.data.name"></h1>
        <div x-show="pageState.data">Some tune here</div>
        <div x-show="!pageState.data">No tune here</div>
        <ul>
          <template x-for="performance in pageState.data.performances">
            <li><a href="#" x-text="performance.sessionName" @click="loadSession(performance.sessionId, performance.sessionName)"></a></li>
          </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'session'">
      <div @sx:waveform-ready.window="pageState.data.ready = true"
           @sx:waveform-load-progress-updated.window="pageState.data.loading = $event.detail.loading"
           @sx:tune-creating.window="createTune($event.detail.sessionId, $event.detail.startTime, $event.detail.endTime)" >
        <h1 x-text="pageState.data.sessionName"></h1>
        <div x-show="!pageState.data.ready">
          Loading: <span x-text="pageState.data.loading"></span>%
        </div>
        <div x-show="pageState.data.ready">
          <div :data-session-id="pageState.data.sessionId" class="waveform"></div>
        </div>
      </div>
    </template>
  </div>
  <div id="all" hidden ></div>
  <script type="module" src="./ts/main.ts"></script>
</body>

</html>
