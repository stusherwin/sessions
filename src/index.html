<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <div x-data="app">
    <a href="#" @click="loadSessions()">Sessions</a> |
    <a href="#" @click="loadTunes()">Tunes</a>
    <template x-if="pageState.page == 'sessions'">
      <div>
        <h1>Sessions</h1>

        <ul>
        <template x-for="session in sessions">
          <li>
            <a href="#" x-text="session.name" @click="loadSession(session.id)"></a>
            <ul>
            <template x-for="tune in session.tunes">
              <li><a href="#" x-text="tune.tuneName" @click="loadSession(session.id, tune.id)"></a></li>
            </template>
            </ul>
          </li>
        </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'tunes'">
      <div>
        <h1>Tunes</h1>

        <ul>
        <template x-for="tune in tunes">
          <li>
            <a href="#" x-text="tune.name" @click="loadTune(tune.id)"></a>
            <ul>
            <template x-for="performance in tune.performances">
              <li><a href="#" x-text="performance.sessionName" @click="loadSession(performance.sessionId, performance.id)"></a></li>
            </template>
            </ul>
          </li>
        </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'tune'">
      <div>
        <h1 x-text="pageState.data.name"></h1>
        <div x-show="pageState.data">Some tune here</div>
        <div x-show="!pageState.data">No tune here</div>
        <ul>
          <template x-for="performance in pageState.data.performances">
            <li><a href="#" x-text="performance.sessionName" @click="loadSession(performance.sessionId, performance.id)"></a></li>
          </template>
        </ul>
      </div>
    </template>

    <template x-if="pageState.page == 'session'">
      <div @sx:waveform-ready.window="pageState.data.ready = true"
           @sx:waveform-load-progress-updated.window="pageState.data.loading = $event.detail.loading"
           @sx:tune-creating.window="onTuneCreating($event.detail)"
           @sx:tune-updating.window="onTuneUpdating($event.detail)"
           @sx:current-tune-changed.window="onCurrentTuneChanged($event.detail)"
           @sx:playing.window="playing = true"
           @sx:stopped.window="playing = false">
        <h1 x-text="pageState.data.session.name"></h1>
        <div x-show="!pageState.data.ready">
          Loading: <span x-text="pageState.data.loading"></span>%
        </div>
        <div x-show="pageState.data.ready">
          <div :data-session-id="pageState.data.session.id" class="waveform"></div>
          <div>
            <button @click="skipToStart()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-start-fill" />
              </svg>
            </button>
            <button @click="skipBackward()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-backward-fill" />
              </svg>
            </button>
            <button @click="playPause()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use x-show="!playing" href="#play-fill" />
                <use x-show="playing" href="#pause-fill" />
              </svg>
            </button>
            <button @click="skipForward()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-forward-fill" />
              </svg>
            </button>
            <button @click="skipToEnd()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#skip-end-fill" />
              </svg>
            </button>
            <button @click="zoomIn()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#zoom-in" />
              </svg>
            </button>
            <button @click="zoomOut()">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#zoom-out" />
              </svg>
            </button>
            <button @click="toggleEditing()" :class="editing ? 'inverted' : ''">
              <svg class="bi" width="16" height="16" fill="currentColor">
                <use href="#pencil-fill" />
              </svg>
            </button>
          </div>

          <template x-for="tune in pageState.data.session.tunes">
            <div x-data x-init="$watch('tune.tuneName', name => updateTuneName(pageState.data.session.id, tune.id, name))">
              <div x-show="pageState.data.currentTune == tune.id">
                <h2>
                  <span x-show="!editing" x-text="tune.tuneName"></span>
                  <input x-show="editing" type="text" x-model="tune.tuneName" />
                </h2>
                <select x-show="editing" @change="changeTune(pageState.data.session.id, tune.id, $event.target.value)">
                  <template x-for="t in tunes">
                    <option :value="t.id" x-text="t.name" :selected="t.id == tune.tuneId"></option>
                  </template>
                </select>
                <button x-show="editing" @click="deleteTunePerformance(pageState.data.session.id, tune.id)">
                  <svg class="bi" width="16" height="16" fill="currentColor">
                    <use href="#trash-fill" />
                  </svg>
                </button>
                <a href="#" x-text="tune.tuneName" @click="loadTune(tune.tuneId)"></a>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
  <div id="all" hidden ></div>
  <script type="module" src="./ts/main.ts"></script>
</body>

</html>
