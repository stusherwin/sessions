<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session manager</title>
</head>

<body>
  <div>
    <h1>Session manager</h1>

    <div id="waveform" class="my-4"></div>

    <div x-data>
      <button @click="$store.controls.skipToStart()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#skip-start-fill" />
        </svg>
      </button>
      <button @click="$store.controls.skipBackward()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#skip-backward-fill" />
        </svg>
      </button>
      <button @click="$store.controls.playPause()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use x-show="!$store.controls.playing" href="#play-fill" />
          <use x-show="$store.controls.playing" href="#pause-fill" />
        </svg>
      </button>
      <button @click="$store.controls.skipForward()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#skip-forward-fill" />
        </svg>
      </button>
      <button @click="$store.controls.skipToEnd()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#skip-end-fill" />
        </svg>
      </button>
      <button @click="$store.controls.zoomIn()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#zoom-in" />
        </svg>
      </button>
      <button @click="$store.controls.zoomOut()">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#zoom-out" />
        </svg>
      </button>
      <button @click="$store.controls.toggleEditing()" :class="$store.controls.editing ? 'inverted' : ''">
        <svg class="bi" width="16" height="16" fill="currentColor">
          <use href="#pencil-fill" />
        </svg>
      </button>
    </div>

    <div x-data>
      <template x-for="song in $store.songs.all">
        <div x-data x-init="$watch('song.name', name => $dispatch('sx-song-name-updated', {id: song.id, name: name}))">
          <div x-show="song.current">
            <div x-text="song.id"></div>
            <input type="text" x-model="song.name" />
            <div x-text="song.name"></div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script type="module" src="./ts/main.ts"></script>
  <div id="all" hidden ></div>
</body>

</html>
