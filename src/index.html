<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session manager</title>
</head>

<body>
  <div x-data="app">
    <h1>Sessions</h1>

    <template x-for="session in sessions">
      <div>
        <h2 x-text="session.name"></h2>
        <input type="text" x-model="session.name" />
        <button @click="loadWaveform(session)">Load</button>
      </div>
    </template>

    <h1>Tunes</h1>

    <template x-for="tune in tunes">
      <div>
        <h2 x-text="tune.name"></h2>
        <input type="text" x-model="tune.name" />
      </div>
    </template>

    <template x-if="waveform">
      <div @sx-waveform-ready.window="waveform.ready = true"
           @sx-waveform-loading.window="waveform.loading = $event.detail.loading" >
        <h1 x-text="waveform.sessionName"></h1>
        <div x-show="!waveform.ready">
          Loading: <span x-text="waveform.loading"></span>%
        </div>
        <div x-show="waveform.ready">
          <div :data-session-id="waveform.sessionId" class="waveform"></div>
        </div>
      </div>
    </template>
  </div>
  <div id="all" hidden ></div>
  <script type="module" src="./ts/main.ts"></script>
</body>

</html>
