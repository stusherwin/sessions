<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session manager</title>
</head>

<body>
  <div x-data="app">
    <h1>Sessions</h1>

    <template x-for="session in sessions">
      <div>
        <h2 x-text="session.name"></h2>
        <input type="text" x-model="session.name" />
        <button @click="loadWaveform(session.id, session.name)">Load</button>
        <ul>
        <template x-for="tune in session.tunes">
          <li><a href="#" x-text="tune.tuneName" @click="loadWaveform(session.id, session.name)"></a></li>
        </template>
        </ul>
      </div>
    </template>

    <h1>Tunes</h1>

    <template x-for="tune in tunes">
      <div>
        <h2 x-text="tune.name"></h2>
        <input type="text" x-model="tune.name" />
        <ul>
        <template x-for="performance in tune.performances">
          <li><a href="#" x-text="performance.sessionName" @click="loadWaveform(performance.sessionId, performance.sessionName)"></a></li>
        </template>
        </ul>
      </div>
    </template>

    <template x-if="waveform">
      <div @sx:waveform-ready.window="waveform.ready = true"
           @sx:waveform-load-progress-updated.window="waveform.loading = $event.detail.loading"
           @sx:tune-creating.window="createTune($event.detail.sessionId, $event.detail.startTime, $event.detail.endTime)" >
        <h1 x-text="waveform.sessionName"></h1>
        <div x-show="!waveform.ready">
          Loading: <span x-text="waveform.loading"></span>%
        </div>
        <div x-show="waveform.ready">
          <div :data-session-id="waveform.sessionId" class="waveform"></div>
        </div>
      </div>
    </template>
  </div>
  <div id="all" hidden ></div>
  <script type="module" src="./ts/main.ts"></script>
</body>

</html>
