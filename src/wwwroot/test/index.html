<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <frm method="post" @@submit.prevent="uploadBackup($event.target)" enctype="multipart/form-data"
          class="mt-8">
      <h1>Upload backup file</h1>

      <div class="mt-4">
        <label class="upload-label icon-btn-text" for="upload-file">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use href="#folder" />
          </svg>
          Select backup file
        </label>

        <input id="upload-file" 
                name="upload"
                x-model="fileUpload"
                type="file" />
      </div>
      <div x-show="fileUpload" class="mt-2">
        Selected file: <span x-text="(fileUpload || '').replace('C:\\fakepath\\', '')"></span>
      </div>

      <div class="mt-4 button-group">
        <button type="submit" class="icon-btn-text" :disabled="data.saving">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use href="#upload" />
          </svg>
          Upload
        </button>
      </div>
    </frm>
    <form method="post" @@submit.prevent="uploadBackup($event.target)" enctype="multipart/form-data"
          class="mt-8">
      <h1>Upload backup file</h1>

      </div>

        Selected file: <span x-text="(fileUpload || '').replace('C:\\fakepath\\', '')"></span>
      </div>

      <div class="mt-4 button-group">
        <button type="submit" class="icon-btn-text" :disabled="data.saving">
          <svg class="bi" width="16" height="16" fill="currentColor">
            <use href="#upload" />
          </svg>
          Upload
        </button>
      </div>
    </form>
</body>
</html>
