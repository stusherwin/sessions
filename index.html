<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sessions</title>
  </head>
  <body>
    <div id="waveform"></div>

    <div x-data x-id="['loop']">
      <button @click="$store.player.playFromStart()">Play from start</button>
      <button @click="$store.player.playPause()" x-text="$store.player.playing ? 'Pause' : 'Play'">Play / pause</button>
        <template x-for="song in $store.songs.all" :key="song.id">
          <div x-data="song">
            <div x-show="!selected" x-text="name" @click="select()"></div>
            <div x-show="selected">
              <input type="text" x-model="name" />
              <button @click="playFromStart()">Play from start</button>
              <button @click="$store.player.playPause()" x-text="$store.player.playing ? 'Pause' : 'Play'">Play / pause</button>
              <input :id="$id('loop', regionId)" type="checkbox" x-model="loop" />
              <label :for="$id('loop', regionId)">Loop</label>
              <button @click="$dispatch('sx-split', regionId)">Split</button>
              <button @click="remove()">Delete</button>
              <!-- <button @click="$dispatch('shunt-region-left', region.id)">&lt; Shunt</button>
              <button @click="$dispatch('shunt-region-right', region.id)">Shunt &gt;</button>
              <button @click="$dispatch('nudge-region-left', region.id)">&lt; Nudge</button>
              <button @click="$dispatch('nudge-region-right', region.id)">Nudge &gt;</button>
              <button @click="$dispatch('copy-region', region.id)">Copy</button>
              <button @click="delete()">Delete</button>-->
            </div>
          </div>
        </template>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
