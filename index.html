<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sessions</title>
  </head>
  <body>
    <div id="waveform"></div>
    <div x-data x-id="['loop']">
      <button @click="$dispatch('play-pause')" x-text="$store.waveform.playing ? 'Pause' : 'Play'">Play / pause</button>
      <ul>
        <template x-for="region in $store.waveform.regions">
          <li>
            <input type="text" x-model="region.name" />
            <span x-show="$store.waveform.currentRegion == region.id">(Current)</span>
            <button @click="$dispatch('play-region', region.id)">Play</button>
            <input :id="$id('loop', region.id)" type="checkbox" x-model="region.loop" />
            <label :for="$id('loop', region.id)">Loop</label>
            <button @click="$dispatch('shunt-region-left', region.id)">&lt; Shunt</button>
            <button @click="$dispatch('shunt-region-right', region.id)">Shunt &gt;</button>
            <button @click="$dispatch('nudge-region-left', region.id)">&lt; Nudge</button>
            <button @click="$dispatch('nudge-region-right', region.id)">Nudge &gt;</button>
            <button @click="$dispatch('delete-region', region.id)">Delete</button>
          </li>
        </template>
      </ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
